name: Retest existing Alpha 5 ISO in QEMU
on:
  workflow_run:
    workflows: [Alpha 5 ISO build and QEMU boot]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'ISO artifact source workflow run ID'
        required: true
permissions:
  actions: read
  contents: read
jobs:
  qemu:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install QEMU
        run: apt-get update && apt-get install -y qemu-system-x86 python3 ca-certificates
      - name: Download previously built ISO
        uses: actions/download-artifact@v4
        with:
          name: localzet-alpha5-iso
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retest-iso
      - name: Verify ISO checksum
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/retest-iso"
          if [[ -f SHA256SUMS ]]; then
            sha256sum -c SHA256SUMS
          else
            echo "::warning::Source artifact lacks SHA256SUMS; reporting computed ISO digest instead"
            sha256sum ./*.iso
          fi
      - name: QEMU graphical smoke
        shell: bash
        env:
          LOCALZET_QEMU_TIMEOUT: '360'
        run: |
          set -euo pipefail
          mapfile -t images < <(find "$GITHUB_WORKSPACE/retest-iso" -maxdepth 1 -type f -name '*.iso')
          test "${#images[@]}" -eq 1
          bash scripts/qemu-graphical-smoke.sh "${images[0]}" "$GITHUB_WORKSPACE/qemu-smoke"
      - name: Print boot diagnostics
        if: failure()
        shell: bash
        run: |
          for file in "$GITHUB_WORKSPACE/qemu-smoke/boot-report.json" "$GITHUB_WORKSPACE/qemu-smoke/serial.log"; do
            if [[ -f "$file" ]]; then echo "===== $file ====="; tail -c 16000 "$file" || true; fi
          done
      - name: Compress QEMU screen
        if: always()
        shell: bash
        run: |
          dir="$GITHUB_WORKSPACE/qemu-smoke"
          ls -lah "$dir" || true
          if [[ -s "$dir/guest-screen.ppm" ]]; then
            gzip -9 -c "$dir/guest-screen.ppm" > "$dir/guest-screen.ppm.gz"
          fi
      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha5-retest-boot-diagnostics
          path: qemu-smoke/
          if-no-files-found: ignore
