name: Localzet GNOME surface checks

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'packaging/gnome/**'
      - 'packaging/applications/**'
      - 'scripts/build-localzet-live.sh'
      - '.github/workflows/surface-check.yml'
  pull_request:

jobs:
  rust-and-session:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 and layer-shell development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y git ca-certificates curl python3 bash pkg-config build-essential libgtk-4-dev libgtk4-layer-shell-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Validate GNOME packaging
        run: |
          bash scripts/check-source-tree.sh
          python3 -m unittest tests.test_live_builder_contract tests.test_desktop_boot_evidence
      - name: Compile workspace
        run: cargo check --locked --workspace
