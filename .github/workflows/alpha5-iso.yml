name: Ubuntu 26.04 GNOME ISO build and QEMU boot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/alpha5-iso.yml'
      - 'scripts/build-localzet-live.sh'
      - 'scripts/preflight.sh'
      - 'scripts/qemu-graphical-smoke.sh'
      - 'packaging/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
permissions:
  contents: read
jobs:
  iso:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y sudo git python3 ca-certificates live-build debootstrap squashfs-tools xorriso qemu-system-x86 rsync
      - name: Build Ubuntu 26.04 GNOME ISO
        env:
          LOCALZET_BUILD_DIR: ${{ github.workspace }}/iso-build
        run: bash scripts/build-localzet-live.sh
      - name: Boot GNOME Wayland session in QEMU
        shell: bash
        env:
          LOCALZET_QEMU_TIMEOUT: '600'
          LOCALZET_BUILD_DIR: ${{ github.workspace }}/iso-build
        run: |
          set -euo pipefail
          mapfile -t images < <(find "$LOCALZET_BUILD_DIR" -maxdepth 1 -name '*.iso' -type f)
          test "${#images[@]}" -eq 1
          bash scripts/qemu-graphical-smoke.sh "${images[0]}" "$GITHUB_WORKSPACE/qemu-smoke"
      - name: Stage ISO artifact in workspace
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/iso-artifact"
          find "$GITHUB_WORKSPACE/iso-build" -maxdepth 1 -type f \( -name "*.iso" -o -name "SHA256SUMS" \) -exec cp -v {} "$GITHUB_WORKSPACE/iso-artifact/" \;
          ls -lah "$GITHUB_WORKSPACE/iso-artifact"
      - name: Upload ISO and SHA256SUMS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localzet-ubuntu-26.04-gnome-iso
          path: iso-artifact/
          retention-days: 7
          if-no-files-found: error
      - name: Print boot diagnostics on failure
        if: failure()
        shell: bash
        run: |
          for file in "$GITHUB_WORKSPACE/qemu-smoke/boot-report.json" "$GITHUB_WORKSPACE/qemu-smoke/serial.log"; do
            if [[ -f "$file" ]]; then
              echo "===== $file ====="
              tail -c 16000 "$file" || true
            fi
          done
      - name: Package QEMU screen diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          dir="$GITHUB_WORKSPACE/qemu-smoke"
          ls -lah "$dir" || true
          if [[ -s "$dir/guest-screen.ppm" ]]; then
            gzip -9 -c "$dir/guest-screen.ppm" > "$dir/guest-screen.ppm.gz"
            ls -lh "$dir/guest-screen.ppm.gz"
          fi
      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu26-gnome-build-boot-diagnostics
          path: qemu-smoke/
          if-no-files-found: ignore
