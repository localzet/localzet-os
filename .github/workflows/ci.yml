name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Проверка полноты исходников
        run: bash scripts/check-source-tree.sh
      - name: Bash syntax
        run: find scripts tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
  rust:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Source gate
        run: bash scripts/check-source-tree.sh
      - name: GTK dependencies
        run: apt-get update && apt-get install -y git curl ca-certificates build-essential libgtk-4-dev libgtk4-layer-shell-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --locked --workspace
      - name: Test
        run: cargo test --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Format
        id: format
        run: cargo fmt --all -- --check
      - name: Export rustfmt patch on failure
        if: failure() && steps.format.outcome == 'failure'
        run: |
          cargo fmt --all
          git -c safe.directory="$GITHUB_WORKSPACE" diff --binary > rustfmt.patch
          test -s rustfmt.patch
      - name: Upload rustfmt patch
        if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: rustfmt-patch
          path: rustfmt.patch
