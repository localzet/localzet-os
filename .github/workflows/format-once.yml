name: Normalize Rust formatting (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-once.yml
permissions:
  contents: write
jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt to workspace
        run: cargo fmt --all
      - name: Commit formatting only
        run: |
          set -euo pipefail
          git diff --exit-code --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- crates/
          git diff --cached --quiet && exit 0
          git commit -m "style(rust): apply rustfmt to workspace"
          git push origin HEAD:main
