name: Сборка Live ISO (ручной запуск)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iso:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Проверить полное дерево исходников
        run: bash scripts/check-source-tree.sh
      - name: Подготовить инструменты live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso rsync qemu-system-x86 python3
      - name: Собрать ISO
        run: |
          bash scripts/build-localzet-live.sh
      - name: Проверить ISO в QEMU
        env:
          LOCALZET_QEMU_TIMEOUT: '600'
        run: |
          mapfile -t images < <(find out/localzet-ubuntu-26.04 -maxdepth 1 -type f -name '*.iso')
          test "${#images[@]}" -eq 1
          bash scripts/qemu-graphical-smoke.sh "${images[0]}" "$GITHUB_WORKSPACE/qemu-smoke"
      - name: Собрать сведения об ISO
        run: |
          find out/localzet-ubuntu-26.04 -maxdepth 1 -name '*.iso' -type f -print
          test -s out/localzet-ubuntu-26.04/SHA256SUMS
      - name: Опубликовать ISO как CI-артефакт, НЕ релиз
        uses: actions/upload-artifact@v4
        with:
          name: localzet-os-unverified-live-iso
          path: |
            out/localzet-ubuntu-26.04/*.iso
            out/localzet-ubuntu-26.04/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
